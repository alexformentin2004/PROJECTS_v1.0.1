<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PROJECTS" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css" />
  <title>PROJECTS</title>
</head>
<body>
  <a class="skip-link" href="#view">Vai al contenuto</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ALEX HUB MODULE</p>
        <h1 id="screenTitle">Home</h1>
      </div>
      <div class="topbar-actions">
        <span id="connectionBadge" class="connection-badge" role="status" aria-live="polite" hidden>Offline</span>
        <button class="icon-button" id="settingsButton" type="button" aria-label="Impostazioni" title="Impostazioni">
          <span aria-hidden="true">⚙︎</span>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <button id="quickAddButton" class="quick-add" type="button" aria-label="Crea nuovo elemento" title="Nuovo">
      <span aria-hidden="true">＋</span>
    </button>

    <nav class="tabbar" aria-label="Navigazione principale">
      <a href="#/home" data-route="home" class="tab-link"><span class="tab-icon" aria-hidden="true">⌂</span><span>Home</span></a>
      <a href="#/projects" data-route="projects" class="tab-link"><span class="tab-icon" aria-hidden="true">▦</span><span>Progetti</span></a>
      <a href="#/today" data-route="today" class="tab-link"><span class="tab-icon" aria-hidden="true">✓</span><span>Oggi</span></a>
      <a href="#/archive" data-route="archive" class="tab-link"><span class="tab-icon" aria-hidden="true">▤</span><span>Archivio</span></a>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>

  <section id="quickSheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="quickSheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <div><p class="eyebrow">AZIONI RAPIDE</p><h2 id="quickSheetTitle">Crea</h2></div>
      <button data-close-sheet class="icon-button" type="button" aria-label="Chiudi">×</button>
    </div>
    <div class="action-stack">
      <button class="action-card" type="button" data-action="new-task">
        <span class="action-glyph">✓</span><span><strong>Nuovo task</strong><small>Aggiungi un’attività a un progetto</small></span>
      </button>
      <button class="action-card" type="button" data-action="new-project">
        <span class="action-glyph">＋</span><span><strong>Nuovo progetto</strong><small>Parti da zero o usa un template</small></span>
      </button>
    </div>
    <p class="sheet-note">Task, progetti e template sono operativi anche offline. Le milestone si aggiungono dal dettaglio del progetto.</p>
  </section>

  <section id="editorSheet" class="bottom-sheet editor-sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <div><p class="eyebrow">PROJECTS</p><h2 id="editorTitle">Nuovo progetto</h2></div>
      <button data-close-sheet class="icon-button" type="button" aria-label="Chiudi">×</button>
    </div>
    <div id="editorBody"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <noscript><div class="noscript-warning">PROJECTS richiede JavaScript per funzionare.</div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
